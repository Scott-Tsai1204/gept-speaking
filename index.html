<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF3F9">
<title>英檢初級口說練習：怪獸挑戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF3F9; --card:#FFFFFF; --ink:#14213D; --mute:#5B6785;
  --cobalt:#2F5BEA; --marigold:#FFB627; --ok:#1E9E6A; --bad:#D6455D;
  --okbg:#DDF3EA; --badbg:#FBE1E6; --line:#D5DDEA;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.55;min-height:100dvh}
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}
h1{font-size:30px;line-height:1.25;margin:0 0 12px;font-weight:700}
h2{font-size:24px;margin:0;font-weight:700}
p{margin:0 0 12px}
.en{font-family:Lexend,"Noto Sans TC",sans-serif}
.muted{color:var(--mute)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px}
.btn{border:0;border-radius:999px;padding:14px 26px;min-height:48px;font-weight:700;background:var(--ink);color:#fff}
.btn.primary{background:var(--cobalt)}
.btn.line{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.ghost{background:none;border:0;color:var(--mute);padding:10px 4px;min-height:44px}

/* start */
.start{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:24px 0}
.start .btn{align-self:flex-start;margin-top:12px}
.opt{display:flex;gap:10px;align-items:center;margin-top:8px;min-height:44px}
.opt input{width:22px;height:22px;accent-color:var(--cobalt)}
.note{font-size:14px;color:var(--mute);margin-top:16px}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:4px 0 8px;flex-wrap:wrap}
.segs{flex:1;display:grid;gap:6px}
.segs i{height:8px;border-radius:4px;background:var(--line)}
.segs i.done{background:var(--cobalt)}
.segs i.now{background:var(--marigold)}
.pts{font-size:14px;color:var(--mute);text-align:right;min-width:74px}
.pts b{color:var(--ink);font-size:18px}
.badge.boss-badge{background:var(--marigold);color:var(--ink);border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700;margin-left:4px}

/* monster corridor (map) */
.map{padding:4px 0 24px}
.mon-card{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:10px;text-align:left}
.mon-card.boss{border-color:var(--marigold);background:#FFF7E6}
.mon-card.final{border-color:var(--bad);background:#FEECEF}
.mon-card.locked{opacity:.5}
.mon-ic{font-size:32px;width:44px;text-align:center;flex-shrink:0}
.mon-info{display:flex;flex-direction:column;gap:2px;flex:1}
.mon-name{font-weight:700}
.mon-sub{font-size:13px;color:var(--mute)}
.stars-big{font-size:26px;color:var(--marigold);letter-spacing:2px}
.review-card{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:14px 16px;margin-top:6px;display:flex;flex-direction:column;gap:10px}
.review-head{display:flex;align-items:center;gap:12px}
.review-emoji{font-size:30px}
.review-title{font-weight:700}
.review-sub{font-size:13px;color:var(--mute)}

/* map entrance + idle animations */
.mon-card,.review-card{animation:cardIn .45s cubic-bezier(.16,1,.3,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.mon-card:not(.locked) .mon-ic{display:inline-block;animation:monBob 2.4s ease-in-out infinite}
@keyframes monBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.mon-card.boss:not(.locked){animation:cardIn .45s cubic-bezier(.16,1,.3,1) both,bossGlow 1.8s ease-in-out infinite}
@keyframes bossGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,182,39,0)}50%{box-shadow:0 0 14px 2px rgba(255,182,39,.55)}}
.mon-card.final:not(.locked){animation:cardIn .45s cubic-bezier(.16,1,.3,1) both,finalGlow 1.6s ease-in-out infinite}
@keyframes finalGlow{0%,100%{box-shadow:0 0 0 0 rgba(214,69,93,0)}50%{box-shadow:0 0 16px 3px rgba(214,69,93,.55)}}
.mon-card.current{position:relative}
.mon-card.current::after{content:"";position:absolute;inset:-3px;border-radius:19px;border:2px solid var(--cobalt);animation:currentPulse 1.6s ease-in-out infinite;pointer-events:none}
@keyframes currentPulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.9;transform:scale(1.015)}}
@media (prefers-reduced-motion:reduce){.mon-card,.review-card,.mon-card:not(.locked) .mon-ic,.mon-card.boss:not(.locked),.mon-card.final:not(.locked),.mon-card.current::after{animation:none!important}}

/* path map (闖關地圖)：正式美術背景 + 疊加節點 */
.zone-wrap{position:relative;width:100%;margin:0 0 28px;line-height:0}
.zone-bg{display:block;width:100%;height:auto}
.path-node{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:var(--card);border:3px solid var(--line);display:grid;place-items:center;font-size:26px;padding:0;animation:cardIn .45s cubic-bezier(.16,1,.3,1) both;box-shadow:0 2px 8px rgba(20,33,61,.35)}
.path-node.locked{opacity:.5}
.path-node.boss{border-color:var(--marigold)}
.path-node.final{border-color:var(--bad);width:74px;height:74px;font-size:32px}
.path-node:not(.locked){animation:cardIn .45s cubic-bezier(.16,1,.3,1) both,monBob 2.4s ease-in-out infinite}
.path-node.boss:not(.locked){animation:cardIn .45s cubic-bezier(.16,1,.3,1) both,bossGlow 1.8s ease-in-out infinite}
.path-node.final:not(.locked){animation:cardIn .45s cubic-bezier(.16,1,.3,1) both,finalGlow 1.6s ease-in-out infinite}
.path-node.current::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--cobalt);animation:currentPulse 1.6s ease-in-out infinite;pointer-events:none}
.path-node-label{position:absolute;transform:translate(-50%,30px);font-size:11px;color:var(--mute);white-space:nowrap;text-align:center;pointer-events:none}
.path-avatar{position:absolute;transform:translate(-65%,-135%);width:52px;animation:avatarBob 1.6s ease-in-out infinite;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(20,33,61,.45))}
.path-avatar img{display:block;width:100%;height:auto}
.path-avatar .hero-walk{width:52px;height:75px;overflow:hidden;position:relative}
.path-avatar .hero-walk img{position:absolute;top:0;left:0;width:260px;height:75px;max-width:none;animation:heroWalkCycle .8s steps(5) infinite}
@keyframes avatarBob{0%,100%{transform:translate(-65%,-135%)}50%{transform:translate(-65%,-147%)}}
@keyframes heroWalkCycle{from{transform:translateX(0)}to{transform:translateX(-260px)}}
@media (prefers-reduced-motion:reduce){.path-node,.path-node:not(.locked),.path-node.boss:not(.locked),.path-node.final:not(.locked),.path-node.current::after,.path-avatar,.path-avatar .hero-walk img{animation:none!important}}
.passage-box{font-size:17px;line-height:1.6;text-align:left;background:var(--card);border-radius:16px;padding:16px;width:100%;box-shadow:0 1px 0 var(--line)}

/* battle arena */
.arena{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:2px}
.mon-ring{position:relative;width:136px;height:136px;border-radius:50%;background:var(--card);border:3px solid var(--line);display:grid;place-items:center;font-size:58px;transition:filter .3s,opacity .3s}
.battle-attack-fx{position:absolute;inset:0;pointer-events:none}
.battle-hero{position:absolute;left:-4px;bottom:-4px;width:52px;height:52px;background-repeat:no-repeat;background-size:500% 100%;animation:spriteStep5 .7s steps(5) 1;filter:drop-shadow(0 2px 4px rgba(20,33,61,.4))}
.battle-effect{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:130px;height:84px;background-repeat:no-repeat;background-size:500% 100%;animation:spriteStep5 .7s steps(5) 1}
.monster-hit-fx{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:120px;height:128px;background-repeat:no-repeat;background-size:500% 100%;animation:spriteStep5 .55s steps(5) 1;pointer-events:none;z-index:8}
.monster-vanish-fx{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:140px;height:87px;background-repeat:no-repeat;background-size:500% 100%;animation:spriteStep5 .65s steps(5) 1;pointer-events:none;z-index:8}
@keyframes spriteStep5{from{background-position-x:0%}to{background-position-x:100%}}
@media (prefers-reduced-motion:reduce){.battle-hero,.battle-effect,.monster-hit-fx,.monster-vanish-fx{animation:none!important}}
.mon-ring.boss{border-color:var(--marigold)}
.mon-ring.final{border-color:var(--bad)}
.mon-ring.boss-portrait{width:208px;height:208px}
.mon-ring.boss-portrait img.boss-art{width:88%;height:88%;object-fit:contain;transition:opacity .12s}
.mon-ring.boss-portrait img.boss-art.anim-hidden{opacity:0}
/* Boss 受擊／死亡素材條：幀間距不完全等寬，所以由 boss.js 逐幀設定 background-position；左右邊緣羽化，避免切到隔壁幀的法杖/光暈 */
.boss-sprite{position:absolute;left:50%;top:50%;background-repeat:no-repeat;pointer-events:none;z-index:7;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 28%,#000 72%,transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 28%,#000 72%,transparent 100%)}
.boss-defeat-smoke{z-index:8;-webkit-mask-image:none;mask-image:none}
.mon-ring.hit{animation:hitShake .35s ease}
.mon-ring.counter{animation:counterPulse .4s ease}
.mon-ring.down{filter:grayscale(1);opacity:.35}
@keyframes hitShake{0%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-5deg)}40%{transform:translateX(8px) rotate(5deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}100%{transform:translateX(0)}}
@keyframes counterPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.mon-ring.hit,.mon-ring.counter{animation:none!important}}
.arena .mon-name{font-weight:700;font-size:16px}
.hp-wrap{width:220px;max-width:78vw}
.hp-bar-bg{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.hp-bar-fill{height:100%;background:linear-gradient(90deg,var(--ok),#38C98A);border-radius:7px;transition:width .4s ease}
.hp-bar-fill.low{background:linear-gradient(90deg,var(--bad),#F2778F)}

/* stage */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:10px 0}
.ring{width:172px;height:172px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;position:relative;transition:background .2s}
.ring svg{width:64px;height:64px}
.ring .bars{display:none;gap:6px;align-items:center;height:64px}
.ring .bars span{width:8px;height:100%;border-radius:4px;background:var(--ink);transform:scaleY(.25);animation:bar 0.9s ease-in-out infinite}
.ring .bars span:nth-child(2){animation-delay:.12s}.ring .bars span:nth-child(3){animation-delay:.24s}
.ring .bars span:nth-child(4){animation-delay:.36s}.ring .bars span:nth-child(5){animation-delay:.48s}
.ring[data-state="hear"]{background:var(--cobalt);animation:ripple 1.6s ease-out infinite}
.ring[data-state="say"]{background:var(--marigold);color:var(--ink);animation:ripple2 1.6s ease-out infinite}
.ring[data-state="say"] svg{display:none}
.ring[data-state="say"] .bars{display:flex}
.ring[data-state="busy"]{opacity:.55}
.ring[data-state="idle"]{cursor:default}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(47,91,234,.45)}100%{box-shadow:0 0 0 34px rgba(47,91,234,0)}}
@keyframes ripple2{0%{box-shadow:0 0 0 0 rgba(255,182,39,.6)}100%{box-shadow:0 0 0 34px rgba(255,182,39,0)}}
@keyframes bar{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.ring,.ring .bars span{animation:none!important}}
#hint{min-height:1.5em;font-size:14px}
#live{min-height:1.6em;font-size:17px}
#peek{font-size:22px;min-height:1.4em}

/* result */
.result{background:var(--card);border-radius:20px;padding:20px;margin-top:6px;text-align:left;box-shadow:0 1px 0 var(--line)}
.score{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.score b{font-size:44px;line-height:1;font-family:Lexend,sans-serif}
.tag{font-weight:700;padding:2px 10px;border-radius:8px;font-size:14px}
.tag.pass{background:var(--okbg);color:#0F6B49}
.tag.try{background:var(--badbg);color:#A02843}
.w{display:inline-block;padding:4px 10px;margin:4px 4px 0 0;border-radius:8px;font-size:19px}
.w.ok{background:var(--okbg);color:#0F6B49}
.w.bad{background:var(--badbg);color:#A02843;border-bottom:3px solid var(--bad)}
.heard{font-size:15px;color:var(--mute);margin:12px 0 0}
.msg{color:#A02843;font-weight:500;margin:0 0 8px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.actions .primary{margin-left:auto}

/* summary */
.sum{flex:1;padding:16px 0}
.big{font-family:Lexend,sans-serif;font-size:64px;font-weight:600;line-height:1}
.list{list-style:none;padding:0;margin:16px 0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list li span:first-child{font-family:Lexend,sans-serif;font-size:15px}
.chips span{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 10px;margin:4px 6px 0 0;font-family:Lexend,sans-serif;font-size:15px}
</style>
</head>
<body>
<div id="app"></div>

<script src="src/gameState.js"></script>
<script src="src/voice.js"></script>
<script src="src/battle.js"></script>
<script src="src/questions.js"></script>
<script src="src/map.js"></script>
<script src="src/boss.js"></script>
<script src="src/main.js"></script>
</body>
</html>
