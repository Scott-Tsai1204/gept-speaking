<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF3F9">
<title>英檢初級口說練習：怪獸挑戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF3F9; --card:#FFFFFF; --ink:#14213D; --mute:#5B6785;
  --cobalt:#2F5BEA; --marigold:#FFB627; --ok:#1E9E6A; --bad:#D6455D;
  --okbg:#DDF3EA; --badbg:#FBE1E6; --line:#D5DDEA;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.55;min-height:100dvh}
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}
h1{font-size:30px;line-height:1.25;margin:0 0 12px;font-weight:700}
h2{font-size:24px;margin:0;font-weight:700}
p{margin:0 0 12px}
.en{font-family:Lexend,"Noto Sans TC",sans-serif}
.muted{color:var(--mute)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px}
.btn{border:0;border-radius:999px;padding:14px 26px;min-height:48px;font-weight:700;background:var(--ink);color:#fff}
.btn.primary{background:var(--cobalt)}
.btn.line{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.ghost{background:none;border:0;color:var(--mute);padding:10px 4px;min-height:44px}

/* start */
.start{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:24px 0}
.start .btn{align-self:flex-start;margin-top:12px}
.opt{display:flex;gap:10px;align-items:center;margin-top:8px;min-height:44px}
.opt input{width:22px;height:22px;accent-color:var(--cobalt)}
.note{font-size:14px;color:var(--mute);margin-top:16px}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:4px 0 8px;flex-wrap:wrap}
.segs{flex:1;display:grid;gap:6px}
.segs i{height:8px;border-radius:4px;background:var(--line)}
.segs i.done{background:var(--cobalt)}
.segs i.now{background:var(--marigold)}
.pts{font-size:14px;color:var(--mute);text-align:right;min-width:74px}
.pts b{color:var(--ink);font-size:18px}
.badge.boss-badge{background:var(--marigold);color:var(--ink);border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700;margin-left:4px}

/* monster corridor (map) */
.map{padding:4px 0 24px}
.mon-card{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:10px;text-align:left}
.mon-card.boss{border-color:var(--marigold);background:#FFF7E6}
.mon-card.final{border-color:var(--bad);background:#FEECEF}
.mon-card.locked{opacity:.5}
.mon-ic{font-size:32px;width:44px;text-align:center;flex-shrink:0}
.mon-info{display:flex;flex-direction:column;gap:2px;flex:1}
.mon-name{font-weight:700}
.mon-sub{font-size:13px;color:var(--mute)}
.stars-big{font-size:26px;color:var(--marigold);letter-spacing:2px}
.review-card{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:14px 16px;margin-top:6px;display:flex;flex-direction:column;gap:10px}
.review-head{display:flex;align-items:center;gap:12px}
.review-emoji{font-size:30px}
.review-title{font-weight:700}
.review-sub{font-size:13px;color:var(--mute)}

/* battle arena */
.arena{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:2px}
.mon-ring{width:136px;height:136px;border-radius:50%;background:var(--card);border:3px solid var(--line);display:grid;place-items:center;font-size:58px;transition:filter .3s,opacity .3s}
.mon-ring.boss{border-color:var(--marigold)}
.mon-ring.final{border-color:var(--bad)}
.mon-ring.hit{animation:hitShake .35s ease}
.mon-ring.counter{animation:counterPulse .4s ease}
.mon-ring.down{filter:grayscale(1);opacity:.35}
@keyframes hitShake{0%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-5deg)}40%{transform:translateX(8px) rotate(5deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}100%{transform:translateX(0)}}
@keyframes counterPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.mon-ring.hit,.mon-ring.counter{animation:none!important}}
.arena .mon-name{font-weight:700;font-size:16px}
.hp-wrap{width:220px;max-width:78vw}
.hp-bar-bg{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.hp-bar-fill{height:100%;background:linear-gradient(90deg,var(--ok),#38C98A);border-radius:7px;transition:width .4s ease}
.hp-bar-fill.low{background:linear-gradient(90deg,var(--bad),#F2778F)}

/* stage */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:10px 0}
.ring{width:172px;height:172px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;position:relative;transition:background .2s}
.ring svg{width:64px;height:64px}
.ring .bars{display:none;gap:6px;align-items:center;height:64px}
.ring .bars span{width:8px;height:100%;border-radius:4px;background:var(--ink);transform:scaleY(.25);animation:bar 0.9s ease-in-out infinite}
.ring .bars span:nth-child(2){animation-delay:.12s}.ring .bars span:nth-child(3){animation-delay:.24s}
.ring .bars span:nth-child(4){animation-delay:.36s}.ring .bars span:nth-child(5){animation-delay:.48s}
.ring[data-state="hear"]{background:var(--cobalt);animation:ripple 1.6s ease-out infinite}
.ring[data-state="say"]{background:var(--marigold);color:var(--ink);animation:ripple2 1.6s ease-out infinite}
.ring[data-state="say"] svg{display:none}
.ring[data-state="say"] .bars{display:flex}
.ring[data-state="busy"]{opacity:.55}
.ring[data-state="idle"]{cursor:default}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(47,91,234,.45)}100%{box-shadow:0 0 0 34px rgba(47,91,234,0)}}
@keyframes ripple2{0%{box-shadow:0 0 0 0 rgba(255,182,39,.6)}100%{box-shadow:0 0 0 34px rgba(255,182,39,0)}}
@keyframes bar{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.ring,.ring .bars span{animation:none!important}}
#hint{min-height:1.5em;font-size:14px}
#live{min-height:1.6em;font-size:17px}
#peek{font-size:22px;min-height:1.4em}

/* result */
.result{background:var(--card);border-radius:20px;padding:20px;margin-top:6px;text-align:left;box-shadow:0 1px 0 var(--line)}
.score{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.score b{font-size:44px;line-height:1;font-family:Lexend,sans-serif}
.tag{font-weight:700;padding:2px 10px;border-radius:8px;font-size:14px}
.tag.pass{background:var(--okbg);color:#0F6B49}
.tag.try{background:var(--badbg);color:#A02843}
.w{display:inline-block;padding:4px 10px;margin:4px 4px 0 0;border-radius:8px;font-size:19px}
.w.ok{background:var(--okbg);color:#0F6B49}
.w.bad{background:var(--badbg);color:#A02843;border-bottom:3px solid var(--bad)}
.heard{font-size:15px;color:var(--mute);margin:12px 0 0}
.msg{color:#A02843;font-weight:500;margin:0 0 8px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.actions .primary{margin-left:auto}

/* summary */
.sum{flex:1;padding:16px 0}
.big{font-family:Lexend,sans-serif;font-size:64px;font-weight:600;line-height:1}
.list{list-style:none;padding:0;margin:16px 0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list li span:first-child{font-family:Lexend,sans-serif;font-size:15px}
.chips span{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 10px;margin:4px 6px 0 0;font-family:Lexend,sans-serif;font-size:15px}
</style>
</head>

<script>
"use strict";
/* ===== 題庫：原創的初級程度句子，不分主題，依難度分三池 ===== */

const MEDIUM = [

  "She practices the piano for thirty minutes every evening.",
  "We are planning a short trip to the mountains next month.",
  "My brother works at a hospital near our house.",
  "It might rain later, so bring an umbrella with you.",
  "I have been learning English for almost two years.",

const HARD = [
  "I usually study in the library after school because it is quiet there.",
  "My favorite subject is science, but math is more difficult for me.",
  "We have to hand in our history report before next Monday.",
  "The new gym is bigger than the old one, so more students can use it.",
  "I forgot my umbrella, so I got wet walking home from school.",
  "I want to order a beef burger with french fries and a small salad.",
  "Could you tell me if this restaurant has any vegetarian dishes on the menu?",
  "We waited for almost thirty minutes before our food finally arrived.",
  "My sister doesn't like seafood, so she always orders chicken or beef.",
  "The restaurant was so crowded that we had to wait outside for a table.",
  "I'm looking for a birthday present for my mother, but I don't know what to buy.",
  "This store offers a twenty percent discount if you buy two or more items.",
  "Could you tell me where I can find the shoes for children?",
  "I want to return this sweater because the color is different from the picture online.",
  "The shopping mall was so big that we got lost on the second floor.",
  "Excuse me, could you tell me which bus goes to the train station from here?",
  "I usually leave home early because the traffic gets very heavy after eight o'clock.",
  "We need to change trains at the next stop to reach the airport.",
  "The flight was delayed for two hours because of the bad weather.",
  "It normally takes about forty minutes to drive from my house to downtown."
];

/* ===== 怪獸長廊：不分主題，隨機從難度池抽題 ===== */
const MONSTERS = [
  { name:"哈欠史萊姆", emoji:"🟢", hp:5, pool:() => EASY },
  { name:"迷路小兔",   emoji:"🐰", hp:5, pool:() => EASY },
  { name:"貪睡貓怪",   emoji:"🐱", hp:5, pool:() => EASY },
  { name:"風暴衛兵",   emoji:"🌪️", hp:7, boss:true, pool:() => MEDIUM },
  { name:"時鐘怪",     emoji:"⏰", hp:5, pool:() => MEDIUM },
  { name:"迷霧幽靈",   emoji:"👻", hp:5, pool:() => MEDIUM },
  { name:"急驚風",     emoji:"⚡", hp:5, pool:() => MEDIUM },
  { name:"石巨人",     emoji:"🗿", hp:7, boss:true, pool:() => HARD },
  { name:"深海海龍",   emoji:"🐉", hp:5, pool:() => MEDIUM.concat(HARD) },
  { name:"影子刺客",   emoji:"🦇", hp:5, pool:() => MEDIUM.concat(HARD) },
  { name:"雷霆鷹",     emoji:"🦅", hp:5, pool:() => MEDIUM.concat(HARD) },
  { name:"終極魔王",   emoji:"🐲", hp:9, boss:true, final:true, pool:() => HARD }
];
const PASS_LINE = 80;   // 初級口說通過分數

/* ===== 問答挑戰：暖身題／看法題／情境題，交給後端 LLM 評分 ===== */
const WORKER_URL = "https://gept-speaking-proxy.gept-speaking.workers.dev";
const TYPE_LABEL = { warmup: "暖身題", opinion: "看法題", situational: "情境題" };
const QUESTIONS = [
  { type: "warmup", q: "What's your name?" },
  { type: "warmup", q: "How are you today?" },
  { type: "warmup", q: "What day is it today?" },
  { type: "opinion", q: "What do you usually do on weekends?" },
  { type: "opinion", q: "What's your favorite food? Why do you like it?" },
  { type: "opinion", q: "Do you like your school or your job? Why?" },
  { type: "situational", q: "Imagine you are at a restaurant. What would you say to order food?" },
  { type: "situational", q: "Imagine your friend is sick. What would you say to him or her?" },
  { type: "situational", q: "Imagine you are lost in a city. What would you ask someone?" }
];

/* ===== 小工具 ===== */
const $ = s => document.querySelector(s);
const app = $("#app");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const RECORDING_SUPPORTED = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function vibrate(pattern){ try { navigator.vibrate && navigator.vibrate(pattern); } catch(_) {} }

const S = { round: [], i: 0, score: 0, combo: 0, results: [], easy: false, token: 0, mode: null, monsterIndex: null, monster: null, hp: 0 };
let voice = null, activeRec = null, wakeLock = null;

/* ===== 關卡進度（存在這支手機的瀏覽器裡） ===== */
function loadProgress(){
  try {
    const p = JSON.parse(localStorage.getItem("gept_progress_v2") || "null");
    if (Array.isArray(p) && p.length === MONSTERS.length) return p;
  } catch(_) {}
  return MONSTERS.map(() => 0);
}
function saveProgress(p){ try { localStorage.setItem("gept_progress_v2", JSON.stringify(p)); } catch(_) {} }
function isMonsterUnlocked(mi, progress){ return mi === 0 || progress[mi - 1] > 0; }
function starsFromPassed(passed, hp){
  if (passed >= hp) return 3;
  if (passed >= Math.ceil(hp * 0.6)) return 2;
  if (passed >= 1) return 1;
  return 0;
}
function starsStr(n){ return "★".repeat(n) + "☆".repeat(3 - n); }
function totalStars(progress){ return progress.reduce((a, s) => a + s, 0); }

/* ===== 複習池：答錯的整句，之後在複習站再次出現 ===== */
function loadMissedSentences(){
  try { return JSON.parse(localStorage.getItem("gept_missed_sentences") || "{}"); } catch(_) { return {}; }
}
function saveMissedSentences(m){ try { localStorage.setItem("gept_missed_sentences", JSON.stringify(m)); } catch(_) {} }
function bumpMissedSentence(q){ const m = loadMissedSentences(); m[q] = (m[q] || 0) + 1; saveMissedSentences(m); }
function clearMissedSentence(q){ const m = loadMissedSentences(); if (q in m){ delete m[q]; saveMissedSentences(m); } }
function reviewPoolList(){ return Object.entries(loadMissedSentences()).sort((a, b) => b[1] - a[1]); }

/* ===== 文字正規化（把辨識結果與標準答案放在同一基準上比對） ===== */
const ONES = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
const ORD_IRR = { one:"first", two:"second", three:"third", five:"fifth", eight:"eighth", nine:"ninth", twelve:"twelfth" };
const n2w = n => n < 20 ? ONES[n] : TENS[Math.floor(n/10)] + (n%10 ? " " + ONES[n%10] : "");
function ord(n){
  const w = n2w(n).split(" "), last = w.pop();
  const o = ORD_IRR[last] || (last.endsWith("y") ? last.slice(0,-1) + "ieth" : last + "th");
  return [...w, o].join(" ");
}
const CONTR = {"i'm":"i am","it's":"it is","he's":"he is","she's":"she is","that's":"that is","what's":"what is","there's":"there is","here's":"here is","we're":"we are","you're":"you are","they're":"they are","don't":"do not","doesn't":"does not","didn't":"did not","can't":"can not","cannot":"can not","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","won't":"will not","i'll":"i will","i've":"i have","let's":"let us"};
function tokenize(s){
  s = s.toLowerCase().replace(/[’‘]/g, "'");
  s = s.replace(/(\d{1,2}):(\d{2})/g, (m,h,mi) => n2w(+h) + " " + (+mi === 0 ? "" : (+mi < 10 ? "oh " : "") + n2w(+mi)));
  s = s.replace(/(\d{1,2})(st|nd|rd|th)\b/g, (m,n) => ord(+n));
  s = s.replace(/\d{1,2}/g, m => n2w(+m));
  s = s.replace(/[^a-z'\s]/g, " ");
  const out = [];
  s.split(/\s+/).filter(Boolean).forEach(w => {
    w = w.replace(/^'+|'+$/g, "");
    if (!w) return;
    (CONTR[w] ? CONTR[w].split(" ") : [w]).forEach(x => out.push(x));
  });
  return out;
}

/* ===== 逐字對齊（編輯距離） ===== */
function align(t, h){
  const n = t.length, m = h.length;
  const d = Array.from({length:n+1}, () => new Array(m+1).fill(0));
  for (let i=0;i<=n;i++) d[i][0] = i;
  for (let j=0;j<=m;j++) d[0][j] = j;
  for (let i=1;i<=n;i++) for (let j=1;j<=m;j++){
    const c = t[i-1] === h[j-1] ? 0 : 1;
    d[i][j] = Math.min(d[i-1][j-1] + c, d[i-1][j] + 1, d[i][j-1] + 1);
  }
  const ops = new Array(n).fill("del"), extra = [];
  let i = n, j = m;
  while (i > 0 || j > 0){
    const same = i>0 && j>0 && t[i-1] === h[j-1];
    if (i>0 && j>0 && d[i][j] === d[i-1][j-1] + (same ? 0 : 1)){ ops[i-1] = same ? "ok" : "sub"; i--; j--; }
    else if (i>0 && d[i][j] === d[i-1][j] + 1){ ops[i-1] = "del"; i--; }
    else { extra.unshift(h[j-1]); j--; }
  }
  return { ops, extra, dist: d[n][m] };
}

/* ===== 語音：播放題目 ===== */
function loadVoices(){
  return new Promise(res => {
    const v = speechSynthesis.getVoices();
    if (v.length) return res(v);
    speechSynthesis.addEventListener("voiceschanged", () => res(speechSynthesis.getVoices()), { once:true });
    setTimeout(() => res(speechSynthesis.getVoices()), 1500);
  });
}
function speak(text){
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.9;
    if (voice) u.voice = voice;
    let done = false;
    const fin = () => { if (!done){ done = true; clearTimeout(t); resolve(); } };
    const t = setTimeout(fin, 3000 + text.length * 130);   // Android 有時不會觸發 onend，用計時器保底
    u.onend = fin; u.onerror = fin;
    speechSynthesis.speak(u);
  });
}

/* ===== 語音：錄下玩家的回答（有靜音自動偵測），交給後端 Whisper 辨識 ===== */
function recordAudio({ maxMs = 12000, silenceMs = 1200, minMs = 600 } = {}){
  return new Promise(async resolve => {
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch(_) { resolve({ blob: null, error: "not-allowed" }); return; }

    let mime = "audio/webm;codecs=opus";
    if (!(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(mime))) mime = "";
    let rec;
    try { rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); }
    catch(_) { stream.getTracks().forEach(t => t.stop()); resolve({ blob: null, error: "audio-capture" }); return; }

    const chunks = [];
    const startedAt = Date.now();
    let audioCtx, analyser, source, raf, lastLoud = Date.now(), settled = false;

    const cleanup = () => {
      if (raf) cancelAnimationFrame(raf);
      try { source && source.disconnect(); } catch(_){}
      try { audioCtx && audioCtx.close(); } catch(_){}
      stream.getTracks().forEach(t => t.stop());
      activeRec = null;
    };

    rec.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
    rec.onerror = () => {
      if (settled) return;
      settled = true; cleanup();
      resolve({ blob: null, error: "audio-capture" });
    };
    rec.onstop = () => {
      if (settled) return;
      settled = true; cleanup();
      const blob = new Blob(chunks, { type: mime || "audio/webm" });
      resolve(blob.size > 800 ? { blob, error: null } : { blob: null, error: "no-speech" });
    };

    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      source.connect(analyser);
    } catch(_) { analyser = null; }

    activeRec = rec;
    rec.start();
    setState("say", "換你說", "說完停一下會自動送出，也可以點圓圈提早結束");

    const maxTimer = setTimeout(() => { if (rec.state !== "inactive") rec.stop(); }, maxMs);

    if (analyser){
      const data = new Uint8Array(analyser.frequencyBinCount);
      const tick = () => {
        analyser.getByteTimeDomainData(data);
        let sum = 0;
        for (let k = 0; k < data.length; k++){ const v = (data[k] - 128) / 128; sum += v * v; }
        const rms = Math.sqrt(sum / data.length);
        if (rms > 0.02) lastLoud = Date.now();
        const elapsed = Date.now() - startedAt;
        if (elapsed > minMs && Date.now() - lastLoud > silenceMs){
          clearTimeout(maxTimer);
          if (rec.state !== "inactive") rec.stop();
          return;
        }
        raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
    }
  });
}
async function transcribeAudio(blob){
  try {
    const form = new FormData();
    form.append("audio", blob, "answer.webm");
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 20000);
    const res = await fetch(WORKER_URL + "/transcribe", { method: "POST", body: form, signal: controller.signal });
    clearTimeout(timer);
    if (!res.ok) return { text: "", error: "network" };
    const data = await res.json();
    return { text: String(data.text || "").trim(), error: null };
  } catch(_) { return { text: "", error: "network" }; }
}
async function listen(maxMs = 12000){
  const { blob, error } = await recordAudio({ maxMs });
  if (error) return { text: "", error };
  setState("busy", "辨識中…", "AI 正在聽你說的話");
  const { text, error: terr } = await transcribeAudio(blob);
  if (terr) return { text: "", error: terr };
  if (!text) return { text: "", error: "no-speech" };
  return { text, error: null };
}

async function evaluateAnswer(item, r){
  const hardFail = r.error && HARD_ERR.includes(r.error);
  if (hardFail){
    setState("idle", "無法錄音", "");
    $("#resultBox").innerHTML = `<div class="result">${ERR[r.error] ? `<p class="msg">${ERR[r.error]}</p>` : ""}
      <div class="actions"><button class="btn primary" id="retry">再試一次</button></div></div>`;
    $("#retry").onclick = () => runAnswerQuestion();
    return;
  }
  if (!r.text){
    setState("idle", "沒聽到回答", "");
    $("#resultBox").innerHTML = `<div class="result"><p class="msg">沒有辨識到內容，請靠近麥克風再試一次。</p>
      <div class="actions"><button class="btn primary" id="retry">再試一次</button></div></div>`;
    $("#retry").onclick = () => runAnswerQuestion();
    return;
  }
  setState("busy", "評分中…", "老師正在看你的回答");
  $("#resultBox").innerHTML = "";
  let data;
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 20000);
    const res = await fetch(WORKER_URL + "/evaluate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: item.q, answer: r.text }),
      signal: controller.signal
    });
    clearTimeout(timer);
    if (!res.ok) throw new Error("bad status");
    data = await res.json();
    if (typeof data.score !== "number") throw new Error("bad body");
  } catch(_){
    setState("idle", "評分失敗", "");
    $("#resultBox").innerHTML = `<div class="result">
      <p class="msg">連不上評分伺服器，請確認網路連線後再試一次。</p>

      <div class="actions"><button class="btn primary" id="retry">再試一次</button></div></div>`;
    $("#retry").onclick = () => runAnswerQuestion();
    return;
  }

  const first = !S.results[S.i];
  if (first){
    const pass = data.score >= PASS_LINE;
    S.combo = pass ? S.combo + 1 : 0;
    S.results[S.i] = { q: item.q, type: item.type, answer: r.text, score: data.score, feedback: data.feedback || "" };
  }
  setState("idle", data.score >= PASS_LINE ? "回答得很好" : "可以再更完整一點", "");
  const last = S.i === S.round.length - 1;
  const rec = S.results[S.i];
  $("#resultBox").innerHTML = `
    <div class="result">
      <div class="score"><b>${rec.score}</b><span class="tag ${rec.score >= PASS_LINE ? "pass" : "try"}">${rec.score >= PASS_LINE ? "過關" : "再加油"}</span></div>
      <p class="heard en">你說的：${esc(rec.answer)}</p>

      <div class="actions">
        <button class="btn line" id="replay">再聽一次題目</button>
        <button class="btn line" id="retry">再試一次</button>
        <button class="btn primary" id="next">${last ? "看結果" : "下一題"}</button>
      </div>
    </div>`;
  $("#replay").onclick = async () => { $("#replay").disabled = true; await speak(item.q); const b = $("#replay"); if (b) b.disabled = false; };
  $("#retry").onclick = () => runAnswerQuestion();
  $("#next").onclick = () => { if (last) renderAnswerSummary(); else { S.i++; renderAnswerQuestion(); } };
}

async function runQuestion(){

const ERR = {
  "not-allowed": "麥克風被封鎖了。請點網址列左側的圖示，允許麥克風後再試一次。",
  "service-not-allowed": "麥克風被封鎖了。請點網址列左側的圖示，允許麥克風後再試一次。",
  "audio-capture": "找不到麥克風，請確認裝置的麥克風可以使用。",
  "network": "語音辨識需要網路，請確認連線後再試一次。",
  "no-speech": "沒有聽到聲音。請靠近麥克風，看到「換你說」之後再開口。"
};
const HARD_ERR = ["not-allowed", "service-not-allowed", "audio-capture", "network"];

function evaluate(q, r){
  const tw = q.split(/\s+/);
  const tokens = [];
  tw.forEach((w, wi) => tokenize(w).forEach(t => tokens.push({ t, wi })));
  const h = tokenize(r.text || "");
  const { ops, extra, dist } = align(tokens.map(x => x.t), h);
  const pct = r.text ? Math.round(Math.max(0, 1 - dist / tokens.length) * 100) : 0;
  const wordOk = tw.map(() => true);
  tokens.forEach((x, k) => { if (ops[k] !== "ok") wordOk[x.wi] = false; });

  const hardFail = r.error && HARD_ERR.includes(r.error);
  const first = !S.results[S.i] && !hardFail;
  const pass = pct >= PASS_LINE;
  if (first){
    S.combo = pass ? S.combo + 1 : 0;
    S.score += pct + (pass ? S.combo * 10 : 0);
    S.results[S.i] = { q, pct, wordOk, tw };
    bumpMissed(tw.filter((_, k) => !wordOk[k]).map(w => tokenize(w).join(" ")).filter(Boolean));
    if (pass) clearMissedSentence(q); else bumpMissedSentence(q);

    const passedCount = S.results.filter(x => x && x.pct >= PASS_LINE).length;
    const remaining = Math.max(0, S.hp - passedCount);
    const hpFill = $("#hpFill");
    if (hpFill){ hpFill.style.width = (remaining / S.hp * 100) + "%"; hpFill.classList.toggle("low", remaining / S.hp <= .3); }
    const ring = $("#monRing");
    if (ring){
      ring.classList.remove("hit", "counter", "down");
      void ring.offsetWidth;
      if (pass){
        const defeated = remaining <= 0;
        ring.classList.add(defeated ? "down" : "hit");
        vibrate(defeated ? [40, 60, 40, 60, 120] : 45);
      } else {
        ring.classList.add("counter");
        vibrate([30, 40, 30]);
      }
    }
  }

  setState("idle", pct >= PASS_LINE ? "說得很好" : (hardFail ? "無法錄音" : "再接再厲"), "");
  const msg = r.error && ERR[r.error] ? `<p class="msg">${ERR[r.error]}</p>` : "";
  const chips = hardFail ? "" : tw.map((w, k) => `<span class="w en ${wordOk[k] ? "ok" : "bad"}">${esc(w)}</span>`).join("");
  const last = S.i === S.round.length - 1;
  $("#resultBox").innerHTML = `
    <div class="result">
      ${hardFail ? "" : `<div class="score"><b>${pct}</b><span class="tag ${pct >= PASS_LINE ? "pass" : "try"}">${pct >= PASS_LINE ? "命中" : "再練一次"}</span></div>`}
      ${msg}${chips}
      ${!hardFail && r.text ? `<p class="heard en">辨識到：${esc(r.text)}</p>` : ""}
      ${!hardFail && extra.length ? `<p class="heard">多說的字：<span class="en">${esc(extra.join(" "))}</span></p>` : ""}
      <div class="actions">
        <button class="btn line" id="replay">聽標準發音</button>
        <button class="btn line" id="retry">再試一次</button>
        ${hardFail ? "" : `<button class="btn primary" id="next">${last ? "看結果" : "下一題"}</button>`}
      </div>
      ${!first && !hardFail ? '<p class="heard">重試不會改變這題的積分。</p>' : ""}
    </div>`;
  $("#replay").onclick = async () => { $("#replay").disabled = true; await speak(q); const b = $("#replay"); if (b) b.disabled = false; };
  $("#retry").onclick = () => runQuestion();
  const nx = $("#next");
  if (nx) nx.onclick = () => { if (last) renderSummary(); else { S.i++; renderQuestion(); } };
}

/* ===== 常錯的字（存在這支手機的瀏覽器裡） ===== */
function bumpMissed(words){
  try {
    const m = JSON.parse(localStorage.getItem("gept_missed") || "{}");
    words.forEach(w => { m[w] = (m[w] || 0) + 1; });
    localStorage.setItem("gept_missed", JSON.stringify(m));
  } catch(_) {}
}
function topMissed(k = 8){
  try {
    const m = JSON.parse(localStorage.getItem("gept_missed") || "{}");
    return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, k);
  } catch(_) { return []; }
}

function renderSummary(){
  stopAll();
  const done = S.results.filter(Boolean);
  const avg = done.length ? Math.round(done.reduce((a, r) => a + r.pct, 0) / done.length) : 0;
  const passed = done.filter(r => r.pct >= PASS_LINE).length;
  const missed = topMissed();
  const mon = S.monster;

  let extraMsg = "", starsLine = "";
  if (S.mode === "battle"){
    const progress = loadProgress();
    const mi = S.monsterIndex;
    const stars = starsFromPassed(passed, S.hp);
    if (stars > progress[mi]) progress[mi] = stars;
    saveProgress(progress);
    starsLine = `<div class="stars-big">${starsStr(stars)}</div>`;
    if (stars === 3) extraMsg = `<p class="msg" style="color:var(--ok)">🎉 擊敗了 ${esc(mon.name)}！</p>`;
    else if (stars > 0) extraMsg = `<p class="msg" style="color:var(--ok)">${esc(mon.name)} 受傷逃跑了，再挑戰一次可以徹底擊敗！</p>`;
    else extraMsg = `<p class="msg">${esc(mon.name)} 完全沒有受傷，再試一次！</p>`;
  } else {
    extraMsg = `<p class="muted">複習池剩餘 ${reviewPoolList().length} 句</p>`;
  }

  app.innerHTML = `
    <section class="sum">
      <p class="muted">${esc(mon.name)} 戰鬥結果</p>
      ${starsLine}
      <div class="big">${avg}</div>
      <p style="margin-top:8px">${passed} / ${S.round.length} 題達到 ${PASS_LINE} 分，總積分 ${S.score}。</p>
      ${extraMsg}
      <ul class="list">
        ${done.map(r => `<li><span>${esc(r.q)}</span><b>${r.pct}</b></li>`).join("")}
      </ul>
      ${missed.length ? `<p class="muted">你最常說錯的字</p><div class="chips">${missed.map(([w, c]) => `<span>${esc(w)} ×${c}</span>`).join("")}</div>` : ""}
      <div class="actions" style="margin-top:24px">
        <button class="btn primary" id="retryNode" style="margin-left:0">再玩一次</button>
        <button class="btn line" id="toMap">回長廊</button>
      </div>
    </section>`;
  $("#toMap").onclick = renderMap;
  $("#retryNode").onclick = () => { S.mode === "review" ? startReview() : startMonster(S.monsterIndex); };
}

renderStart();
</script>
</body>
</html>
