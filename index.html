<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10172A">
<title>English Adventure 🎮</title>
<style>
:root{
  --bg:#0f172a;--panel:#18233b;--panel2:#202e4b;--ink:#f8fafc;--muted:#aebbd2;
  --gold:#ffd166;--green:#52d273;--red:#ff647c;--blue:#63b3ff;--line:#344565;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
button{font:inherit}
#app{max-width:620px;margin:auto;min-height:100dvh;padding:16px 16px 28px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{font-weight:800;font-size:20px}.sub{color:var(--muted);font-size:12px}
.stats{display:flex;gap:7px;flex-wrap:wrap}.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 10px 30px #0003}
h1,h2,h3{margin:0 0 10px}.muted{color:var(--muted)}
.hero{font-size:48px;text-align:center;margin:5px 0 4px}
.bigbtn{width:100%;border:0;border-radius:18px;padding:16px;background:var(--gold);color:#171717;font-weight:800;cursor:pointer}
.secondary{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.location{padding:15px;border-radius:17px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;text-align:left}
.location.locked{opacity:.42;cursor:not-allowed}.location b{display:block}.location small{color:var(--muted)}
.progress{height:9px;background:#0b1120;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--gold);width:0%;transition:.35s}
.scene{text-align:center}.npc{font-size:58px;margin:2px 0}.bubble{background:#fff;color:#172033;border-radius:20px;padding:15px;text-align:left;margin:8px 0 14px;font-size:19px;font-weight:700}
.quest{font-size:13px;color:var(--gold);font-weight:700}.choices{display:grid;gap:10px;margin-top:14px}
.choice{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:15px;padding:13px;text-align:left;cursor:pointer}
.choice:active,.bigbtn:active{transform:scale(.985)}
.mic{width:104px;height:104px;border-radius:50%;border:5px solid var(--blue);background:#16243d;color:white;font-size:42px;display:block;margin:17px auto;cursor:pointer;box-shadow:0 0 0 0 #63b3ff55}
.mic.listening{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px #63b3ff12}}
.transcript{background:#10182a;border-radius:14px;padding:12px;color:#dbe7ff;min-height:46px}
.feedback{margin-top:12px;padding:12px;border-radius:14px}.good{background:#173b29;color:#baf6ca}.bad{background:#45202a;color:#ffc0ca}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mini{padding:11px;border-radius:13px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer}
.reward{font-size:30px;text-align:center;margin:8px}.center{text-align:center}
.mapTitle{display:flex;justify-content:space-between;align-items:end}.xp{font-size:12px;color:var(--muted)}
.hidden{display:none!important}
.badge{display:inline-block;background:#31415f;padding:4px 8px;border-radius:999px;font-size:12px;margin:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const locations=[
 {id:"school",name:"學校",icon:"🏫",unlock:1,desc:"幫老師找回學生證"},
 {id:"store",name:"便利商店",icon:"🏪",unlock:2,desc:"完成購物任務"},
 {id:"restaurant",name:"餐廳",icon:"🍔",unlock:3,desc:"幫客人完成點餐"},
 {id:"airport",name:"機場",icon:"✈️",unlock:4,desc:"處理失物任務"},
 {id:"island",name:"神秘小島",icon:"🏝️",unlock:5,desc:"終極英語任務"}
];
const missions={
 school:[
  {npc:"👩‍🏫",say:"Good morning! Can you help me?",q:"選擇你要回答的內容",choices:[
   ["Yes, I can.", "yes",10],["I am a sandwich.","no",0],["Good night, teacher.","no",0]
  ],target:"Yes, I can."},
  {npc:"👩‍🏫",say:"Where is your classroom?",choices:[
   ["It is on the second floor.","yes",10],["I like apples.","no",0],["I am twelve.","no",0]
  ],target:"It is on the second floor."},
  {npc:"👦",say:"Can I borrow your pencil?",choices:[
   ["Sure. Here you are.","yes",10],["I am hungry.","no",0],["It is Monday.","no",0]
  ],target:"Sure. Here you are."}
 ],
 store:[
  {npc:"🧑‍💼",say:"Can I help you?",choices:[
   ["Yes. I want some water.","yes",10],["I went to school.","no",0],["My name is Tom.","no",0]
  ],target:"Yes. I want some water."},
  {npc:"🧑‍💼",say:"How much is this?",choices:[
   ["It is five dollars.","yes",10],["I am five years old.","no",0],["It is a dog.","no",0]
  ],target:"It is five dollars."},
  {npc:"🧑‍💼",say:"Have a nice day!",choices:[
   ["Thank you! You too!","yes",10],["Where is the airport?","no",0],["I don't like it.","no",0]
  ],target:"Thank you! You too!"}
 ],
 restaurant:[
  {npc:"👨‍🍳",say:"Are you ready to order?",choices:[
   ["Yes. I'd like a hamburger, please.","yes",10],["I am at school.","no",0],["It is raining.","no",0]
  ],target:"Yes. I'd like a hamburger, please."},
  {npc:"👨‍🍳",say:"What would you like to drink?",choices:[
   ["I'd like some orange juice.","yes",10],["I can swim.","no",0],["It is Monday.","no",0]
  ],target:"I'd like some orange juice."},
  {npc:"👨‍🍳",say:"Was everything good?",choices:[
   ["Yes, it was delicious!","yes",10],["I have two brothers.","no",0],["This is my classroom.","no",0]
  ],target:"Yes, it was delicious!"}
 ],
 airport:[
  {npc:"🧑‍✈️",say:"Excuse me. What is your problem?",choices:[
   ["My suitcase is missing.","yes",10],["I want a hamburger.","no",0],["I play badminton.","no",0]
  ],target:"My suitcase is missing."},
  {npc:"🧑‍✈️",say:"What color is your suitcase?",choices:[
   ["It is black.","yes",10],["I am thirteen.","no",0],["I like music.","no",0]
  ],target:"It is black."},
  {npc:"🧑‍✈️",say:"Where are you going?",choices:[
   ["I am going to Japan.","yes",10],["I am very hungry.","no",0],["This is my pencil.","no",0]
  ],target:"I am going to Japan."}
 ],
 island:[
  {npc:"🧙",say:"Welcome, traveler! What can you do?",choices:[
   ["I can speak English!","yes",10],["I am a banana.","no",0],["It is a chair.","no",0]
  ],target:"I can speak English!"},
  {npc:"🧙",say:"Can you solve the final puzzle?",choices:[
   ["Yes, I can.","yes",10],["I don't have a pencil.","no",0],["Good morning.","no",0]
  ],target:"Yes, I can."},
  {npc:"🏆",say:"You made it! Tell me: Are you ready for the next adventure?",choices:[
   ["Yes! Let's go!","yes",10],["I am a school.","no",0],["No, I am a sandwich.","no",0]
  ],target:"Yes! Let's go!"}
 ]
};
let S=JSON.parse(localStorage.getItem("engAdventure")||"null")||{level:1,xp:0,coins:0,best:0,completed:{},hp:3};
let current=null, rec=null, listening=false;

function save(){localStorage.setItem("engAdventure",JSON.stringify(S))}
function level(){return Math.floor(S.xp/60)+1}
function xpToNext(){return 60-(S.xp%60)}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function speak(text){
 if(!("speechSynthesis" in window)){alert("你的瀏覽器不支援語音播放。");return}
 const play=()=>{
   speechSynthesis.cancel();
   const u=new SpeechSynthesisUtterance(String(text));
   u.lang="en-US";
   u.rate=.88;
   u.pitch=1;
   speechSynthesis.speak(u);
 };
 play();
 setTimeout(()=>{ if(speechSynthesis.paused) speechSynthesis.resume(); },120);
}
function header(){return `<div class="top"><div><div class="brand">🎮 English Adventure</div><div class="sub">用英文完成任務，升級你的冒險者</div></div><div class="stats"><span class="pill">⭐ Lv.${level()}</span><span class="pill">🪙 ${S.coins}</span></div></div>`}
function renderHome(){
 $("#app").innerHTML=header()+`
 <div class="card">
  <div class="hero">🗺️</div><div class="center"><h2>選擇你的冒險地點</h2>
  <div class="xp">XP ${S.xp} · 距離下一級還差 ${xpToNext()} XP</div></div>
  <div class="progress" style="margin-top:10px"><div class="bar" style="width:${(S.xp%60)/60*100}%"></div></div>
  <div class="grid">${locations.map(l=>{let locked=level()<l.unlock;return `<button class="location ${locked?'locked':''}" ${locked?'disabled':''} onclick="startLocation('${l.id}')">${l.icon} <b>${l.name}</b><small>${locked?'🔒 Lv.'+l.unlock+' 解鎖':l.desc}</small></button>`}).join("")}</div>
 </div>
 <div class="card" style="margin-top:12px">
  <h3>🏅 冒險紀錄</h3>
  <span class="badge">最高關卡 Lv.${level()}</span>
  <span class="badge">最佳生命 ❤️ ${S.hp}</span>
  <span class="badge">最高分 ${S.best}</span>
  <button class="bigbtn secondary" style="margin-top:12px" onclick="resetGame()">重新開始</button>
 </div>`;
}
function startLocation(id){
 current={id,idx:0,score:0};
 S.hp=3; save(); renderMission();
}
function renderMission(){
 const m=missions[current.id][current.idx];
 $("#app").innerHTML=header()+`
 <div class="card scene">
  <div class="quest">任務 ${current.idx+1} / ${missions[current.id].length}</div>
  <div class="npc">${m.npc}</div>
  <div class="bubble">${esc(m.say)}</div>
  <button class="mini" onclick="speak(${JSON.stringify(m.say)})">🔊 再聽一次</button>
  <h3 style="margin-top:18px">你會怎麼回答？</h3>
  <div class="choices">${m.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})">${esc(c[0])}</button>`).join("")}</div>
  <div class="muted" style="margin-top:12px">💡 你也可以按麥克風自己回答！</div>
  <button id="mic" class="mic" onclick="voiceAnswer()">🎤</button>
  <div id="heard" class="transcript">尚未偵測到語音</div>
  <div id="feedback"></div>
 </div>
 <div class="actions"><button class="mini" onclick="renderHome()">🏠 地圖</button><button class="mini" onclick="speak(${JSON.stringify(m.target)})">🔊 聽標準回答</button></div>`;
 speak(m.say);
}
function choose(i){
 const m=missions[current.id][current.idx], c=m.choices[i];
 finishAnswer(c[1]==="yes"?c[2]:0,c[0],true);
}
function normalize(s){return s.toLowerCase().replace(/[.,!?'"’]/g,"").replace(/\s+/g," ").trim()}
function similarity(a,b){
 const A=normalize(a).split(" ").filter(Boolean),B=normalize(b).split(" ").filter(Boolean);
 if(!A.length)return 0;
 const dp=Array.from({length:A.length+1},()=>Array(B.length+1).fill(0));
 for(let i=0;i<=A.length;i++)dp[i][0]=i;
 for(let j=0;j<=B.length;j++)dp[0][j]=j;
 for(let i=1;i<=A.length;i++)for(let j=1;j<=B.length;j++)
  dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(A[i-1]===B[j-1]?0:1));
 return Math.max(0,Math.round((1-dp[A.length][B.length]/Math.max(A.length,B.length))*100));
}
function voiceAnswer(){
 if(!SR){$("#feedback").innerHTML=`<div class="feedback bad">⚠️ 這個瀏覽器不支援語音辨識。可以先用選項回答。</div>`;return}
 if(listening){try{rec.stop()}catch(e){}return}
 listening=true;const mic=$("#mic");mic.classList.add("listening");mic.textContent="⏹️";
 $("#heard").textContent="🎧 正在聽你說話…";
 rec=new SR();rec.lang="en-US";rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=3;
 let finalText="",timer=setTimeout(()=>{try{rec.stop()}catch(e){}},15000);
 rec.onresult=e=>{
   let interim="";
   for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t+" ";else interim+=t}
   $("#heard").textContent="🎧 "+(finalText+interim||"…");
 };
 rec.onerror=e=>{
   clearTimeout(timer);listening=false;mic.classList.remove("listening");mic.textContent="🎤";
   const msg=e.error==="not-allowed"?"請允許麥克風權限。":e.error==="no-speech"?"沒有聽到聲音，再試一次。":"語音辨識暫時失敗，再試一次。";
   $("#feedback").innerHTML=`<div class="feedback bad">⚠️ ${msg}</div>`;
 };
 rec.onend=()=>{
   clearTimeout(timer);listening=false;mic.classList.remove("listening");mic.textContent="🎤";
   if(finalText.trim()) finishAnswer(similarity(finalText,missions[current.id][current.idx].target),finalText,false);
   else $("#feedback").innerHTML=`<div class="feedback bad">⚠️ 沒有取得完整語音，再按一次試試。</div>`;
 };
 try{rec.start()}catch(e){listening=false;mic.classList.remove("listening");mic.textContent="🎤"}
}
function finishAnswer(score,answer,choice){
 const m=missions[current.id][current.idx];
 const passed=score>=70;
 if(passed){current.score+=score;S.coins+=Math.max(5,Math.round(score/10));S.xp+=10;S.best=Math.max(S.best,current.score)}
 else {S.hp=Math.max(0,S.hp-1)}
 save();
 const f=$("#feedback");
 f.innerHTML=passed
 ?`<div class="feedback good">🎉 ${score} 分！任務進展成功！<br><b>${esc(answer)}</b><br>+10 XP · +${Math.max(5,Math.round(score/10))} 🪙</div>`
 :`<div class="feedback bad">💭 ${score} 分。再聽一次 NPC，試著再回答！<br><b>${esc(answer)}</b><br>❤️ 剩餘 ${S.hp}</div>`;
 if(passed)speak(["Great job!","Excellent!","Nice answer!"][Math.floor(Math.random()*3)]);
 setTimeout(()=>{
   if(passed){
     current.idx++;
     if(current.idx>=missions[current.id].length)finishLocation();
     else renderMission();
   } else if(S.hp<=0)gameOver();
 },passed?1100:0);
}
function finishLocation(){
 const l=locations.find(x=>x.id===current.id);
 const bonus=30;S.xp+=bonus;S.coins+=20;S.completed[current.id]=true;save();
 $("#app").innerHTML=header()+`<div class="card center">
  <div class="hero">🏆</div><h2>${l.icon} ${l.name}任務完成！</h2>
  <div class="reward">+${bonus} XP<br>+20 🪙</div>
  <p class="muted">你已經完成這個地點的全部任務。</p>
  <button class="bigbtn" onclick="renderHome()">🗺️ 回到冒險地圖</button>
 </div>`;
 speak("Mission complete! Great job!");
}
function gameOver(){
 $("#app").innerHTML=header()+`<div class="card center">
  <div class="hero">😵</div><h2>體力用完啦！</h2><p class="muted">別擔心，重新挑戰就可以繼續冒險。</p>
  <button class="bigbtn" onclick="startLocation('${current.id}')">🔄 再挑戰一次</button>
  <button class="mini" style="width:100%;margin-top:10px" onclick="renderHome()">🏠 回地圖</button>
 </div>`;
}
function resetGame(){if(confirm("確定要清除冒險紀錄嗎？")){S={level:1,xp:0,coins:0,best:0,completed:{},hp:3};save();renderHome()}}
renderHome();
</script>
</body>
</html>
